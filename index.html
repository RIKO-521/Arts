<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>

<body>

<header>

<script type="module">
  import { initChrome, renderHero, loadSharedContent } from "./script.js";
  initChrome("index");
  loadSharedContent().then(renderHero);
